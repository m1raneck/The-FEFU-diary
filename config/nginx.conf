events {}

http {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # CORS (уже добавили)
    add_header 'Access-Control-Allow-Origin' 'http://localhost:8080' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    server {
        listen 80;

        # Обработка OPTIONS (preflight)
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Все location — без завершающего слеша
        location /api/auth {
            proxy_pass http://auth-service:8000;
        }
        location /api/users {
            proxy_pass http://auth-service:8000;
        }
        location /api/schedule {
            proxy_pass http://schedule-service:8000;
        }
        location /api/attendance {
            proxy_pass http://attendance-service:8000;
        }
        location /api/grades {
            proxy_pass http://grades-service:8000;
        }

        # Фронтенд
        location / {
            proxy_pass http://frontend:80;
            proxy_redirect off;
        }
    }
}