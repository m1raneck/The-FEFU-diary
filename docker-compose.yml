version: '3.8'

networks:
  diary_network:
    driver: bridge

services:
  postgres:
    image: postgres:15
    container_name: university
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: university_db
    volumes:
      - postgres_data:/var/lib/postgresql/data   # постоянное хранилище
      - ./database/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./database/03_students.sql:/docker-entrypoint-initdb.d/03_students.sql
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d university_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - diary_network

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: auth_subsystem
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/university_db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - diary_network

  attendance-service:
    build:
      context: .
      dockerfile: ./services/attendance-service/Dockerfile
    container_name: attendance_subsystem
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/university_db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - diary_network

  grades-service:
    build:
      context: .
      dockerfile: ./services/grades-service/Dockerfile
    container_name: grades_subsystem
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/university_db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - diary_network

  schedule-service:
    build:
      context: .
      dockerfile: ./services/schedule-service/Dockerfile
    container_name: schedule_subsystem
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/university_db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - diary_network

  gateway:
    image: nginx:alpine
    container_name: api_gateway
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - auth-service
      - attendance-service
      - grades-service
      - schedule-service
    networks:
      - diary_network

  frontend:
    build: ./frontend
    container_name: diary_frontend
    ports:
      - "8080:80"
    depends_on:
      - gateway
    networks:
      - diary_network
volumes:
  postgres_data: